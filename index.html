
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="header">
      <div>
        <h1>Expense Tracker</h1>
        <p>Manage your money wisely.</p>
      </div>
      <span class="wallet">💰</span>
    </header>

    <section class="balance-card">
      <p>Total Balance</p>
      <h2 id="balance">₹0.00</h2>
      <p class="balance-note">Your current financial balance</p>
    </section>

    <section class="summary">
      <div class="summary-card income">
        <span>↗ Income</span>
        <h3 id="income">₹0.00</h3>
      </div>
      <div class="summary-card expense">
        <span>↘ Expenses</span>
        <h3 id="expense">₹0.00</h3>
      </div>
    </section>

    <section class="form-card">
      <h2>Add Transaction</h2>

      <form id="transaction-form">
        <label for="description">Description</label>
        <input
          type="text"
          id="description"
          placeholder="e.g. College fees"
          maxlength="80"
          required
        >

        <label for="amount">Amount (₹)</label>
        <input
          type="number"
          id="amount"
          placeholder="Enter amount"
          min="0.01"
          step="0.01"
          required
        >

        <label for="type">Transaction Type</label>
        <select id="type" required>
          <option value="income">Income</option>
          <option value="expense">Expense</option>
        </select>

        <button type="submit" class="add-btn">
          + Add Transaction
        </button>
      </form>
    </section>

    <section class="history-card">
      <div class="history-header">
        <h2>Recent Transactions</h2>
        <span id="transaction-count">0 records</span>
      </div>

      <ul id="transaction-list" aria-live="polite"></ul>
      <p id="empty-message">No transactions yet. Add one above!</p>
    </section>

    <footer>
      <p>Made with ❤️ using HTML, CSS & JavaScript</p>
    </footer>
  </main>
</body>
</html>
